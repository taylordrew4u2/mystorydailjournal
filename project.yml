name: MyStoryDailyJournal
options:
  bundleIdPrefix: com.mystorydailyjournal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    ITSAppUsesNonExemptEncryption: false

targets:
  MyStoryDailyJournal:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MyStoryDailyJournal
        excludes:
          - "Support/PrivacyInfo.xcprivacy"
      - path: Sources/MyStoryDailyJournalShared
    resources:
      - path: Sources/MyStoryDailyJournal/Support/PrivacyInfo.xcprivacy
    settings:
      base:
        # XcodeGen's `info:` and `entitlements:` keys GENERATE those files,
        # overwriting whatever is committed at the path. A clean checkout
        # therefore lost NSExtension from every extension (the simulator then
        # refuses to install the app: "extensionDictionary must be set in
        # placeholder attributes") and lost the App Group that the widget and
        # share extension use to reach the store. Point the build settings at
        # the hand-written files instead so they are read, never rewritten.
        INFOPLIST_FILE: Sources/MyStoryDailyJournal/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MyStoryDailyJournal/Support/MyStoryDailyJournal.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mystorydailyjournal.app
        PRODUCT_NAME: My Story
        # PRODUCT_MODULE_NAME defaults to PRODUCT_NAME, which would make the
        # Swift module "My_Story" — so `@testable import MyStoryDailyJournal`
        # cannot resolve and the test target fails to build. Keep the nice
        # product name; keep the module name the code actually imports.
        PRODUCT_MODULE_NAME: MyStoryDailyJournal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
    dependencies:
      - target: MyStoryWidgetsExtension
        embed: true
      - target: MyStoryShareExtension
        embed: true
      - target: MyStoryScreenTimeExtension
        embed: true
    scheme:
      testTargets:
        - MyStoryDailyJournalTests
      gatherCoverageData: true

  MyStoryWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MyStoryWidgets
      - path: Sources/MyStoryDailyJournalShared
    settings:
      base:
        INFOPLIST_FILE: Sources/MyStoryWidgets/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MyStoryWidgets/Support/MyStoryWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mystorydailyjournal.app.widgets
        PRODUCT_NAME: MyStoryWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"

  MyStoryShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MyStoryShareExtension
      - path: Sources/MyStoryDailyJournalShared
    settings:
      base:
        INFOPLIST_FILE: Sources/MyStoryShareExtension/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MyStoryShareExtension/Support/MyStoryShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mystorydailyjournal.app.share
        PRODUCT_NAME: MyStoryShareExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"

  MyStoryScreenTimeExtension:
    # A DeviceActivityReport extension is an ExtensionKit extension, not a
    # plain app extension: it declares EXAppExtensionAttributes rather than
    # NSExtension, and must be embedded in Extensions/ rather than PlugIns/.
    # XcodeGen builds the matching "Embed ExtensionKit Extensions" phase from
    # this type on its own.
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MyStoryScreenTime
    settings:
      base:
        INFOPLIST_FILE: Sources/MyStoryScreenTime/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MyStoryScreenTime/Support/MyStoryScreenTime.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mystorydailyjournal.app.screentime
        PRODUCT_NAME: MyStoryScreenTime
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"

  MyStoryDailyJournalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/MyStoryDailyJournalTests
    dependencies:
      - target: MyStoryDailyJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mystorydailyjournal.app.tests
        GENERATE_INFOPLIST_FILE: true
        # The host app renames its product to "My Story" (PRODUCT_NAME
        # above), but XcodeGen derives TEST_HOST from the target *name* —
        # so the derived path points at a MyStoryDailyJournal.app that is
        # never built, and the scheme fails before it compiles anything
        # with "Could not find test host". Point both at the real product.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/My Story.app/My Story"
        BUNDLE_LOADER: "$(TEST_HOST)"
