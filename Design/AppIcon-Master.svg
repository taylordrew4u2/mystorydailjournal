<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master vector for the app icon mark (build spec §17): a closed book,
  simple silhouette, visible spine line, no page detail, no text. Flat
  fill, at most one shading tone, no gradients.

  This is the source shape every palette variant is rendered from
  (scripts/generate_app_icons.py) — accent and spine-shade colors are the
  only things that change per preset; geometry stays identical.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#F4F1EC"/>
  <g>
    <rect x="192" y="102" width="640" height="820" rx="64" fill="#1F2129"/>
    <path d="M192 166 a64 64 0 0 1 64 -64 h57.6 v820 h-57.6 a64 64 0 0 1 -64 -64 Z" fill="#171820"/>
    <line x1="313.6" y1="112" x2="313.6" y2="912" stroke="#12131A" stroke-width="7"/>
  </g>
</svg>
